<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="gridLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Accent Bars Gradients -->
    <linearGradient id="ganttBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ganttPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ganttEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ganttAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .gantt-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #cbd5e1;
    }

    /* Ambient pulse animations */
    @keyframes pulseBar1 {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50% { transform: scaleX(1.08); opacity: 1; }
    }
    @keyframes pulseBar2 {
      0%, 100% { transform: scaleX(1); opacity: 0.8; }
      50% { transform: scaleX(0.93); opacity: 1; }
    }
    @keyframes pulseBar3 {
      0%, 100% { transform: scaleX(1); opacity: 0.9; }
      50% { transform: scaleX(1.06); opacity: 0.95; }
    }
    @keyframes scanline {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { transform: translateX(700px); opacity: 0.8; }
      100% { transform: translateX(0px); opacity: 0.2; }
    }
    @keyframes particleMove {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 0.9; }
      100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
    }

    .bar-anim-1 {
      animation: pulseBar1 6s ease-in-out infinite;
      transform-origin: 250px center;
    }
    .bar-anim-2 {
      animation: pulseBar2 7s ease-in-out infinite 1s;
      transform-origin: 500px center;
    }
    .bar-anim-3 {
      animation: pulseBar3 8s ease-in-out infinite 2s;
      transform-origin: 805px center;
    }
    .scanner {
      animation: scanline 9s ease-in-out infinite;
    }
    .particle {
      animation: particleMove 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Geometric Grid & Timeline Guides in Background -->
  <g opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="250" y1="0" x2="250" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="400" y1="0" x2="400" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="550" y1="0" x2="550" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="700" y1="0" x2="700" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="850" y1="0" x2="850" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="1150" y1="0" x2="1150" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Subtle Ambient Glow Spheres -->
  <circle cx="220" cy="90" r="160" fill="#38bdf8" opacity="0.07" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="180" fill="#a855f7" opacity="0.06" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED GANTT WATERFALL CHART (LOWER HALF CANVAS) -->
  <g transform="translate(50, 240)">
    <!-- Grid frame -->
    <rect x="0" y="0" width="1100" height="125" rx="10" fill="#090d16" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Timeline Header Months -->
    <text x="30" y="20" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">MILESTONE</text>
    <text x="220" y="20" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600">Q1 · RESEARCH &amp; WBS</text>
    <text x="470" y="20" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600">Q2 · DEVELOPMENT</text>
    <text x="730" y="20" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600">Q3 · CPM SCHEDULING</text>
    <text x="960" y="20" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600">Q4 · RELEASE</text>
    <line x1="0" y1="28" x2="1100" y2="28" stroke="#1e293b" stroke-width="1" />

    <!-- Animated Scanning Laser Cursor -->
    <line class="scanner" x1="220" y1="28" x2="220" y2="125" stroke="#38bdf8" stroke-width="2" opacity="0.6" filter="url(#glow)" />

    <!-- Task Row 1: WBS Strategy -->
    <text x="25" y="54" class="gantt-label">Phase 1: WBS &amp; Core Architecture</text>
    <rect class="bar-anim-1" x="240" y="41" width="210" height="18" rx="9" fill="url(#ganttBlue)" filter="url(#glow)" />
    <circle cx="450" cy="50" r="3.5" fill="#e0f2fe" />

    <!-- Dependency Connector Curve 1 -> 2 -->
    <path d="M 450 50 L 480 50 L 480 77 L 500 77" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7" />

    <!-- Task Row 2: Interactive Timeline / CPM -->
    <text x="25" y="81" class="gantt-label">Phase 2: Critical Path Engine (CPM)</text>
    <rect class="bar-anim-2" x="500" y="68" width="260" height="18" rx="9" fill="url(#ganttPurple)" filter="url(#glow)" />
    <circle cx="760" cy="77" r="3.5" fill="#f3e8ff" />

    <!-- Dependency Connector Curve 2 -> 3 -->
    <path d="M 760 77 L 785 77 L 785 104 L 805 104" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7" />

    <!-- Task Row 3: Deployment & Multi-project Sync -->
    <text x="25" y="108" class="gantt-label">Phase 3: Production Workload &amp; Sync</text>
    <rect class="bar-anim-3" x="805" y="95" width="220" height="18" rx="9" fill="url(#ganttEmerald)" filter="url(#glow)" />
    <polygon points="1045,104 1052,97 1059,104 1052,111" fill="#34d399" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND HEADER CONTENT (ALWAYS CRISP & IN FOREGROUND) -->
  <g transform="translate(60, 52)">
    <!-- Category Micro Badge -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#10b981" class="particle" />
    <text x="28" y="18" class="badge-text">📊 CURATED ECOSYSTEM &amp; BENCHMARK GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="74" class="title-text" fill="url(#titleGrad)" filter="url(#glow)">
      Awesome Gantt Chart &amp; PM Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle-text">
      Enterprise SaaS Platforms, CPM Schedulers &amp; High-Performance Open-Source Libraries
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1: SaaS Leaders -->
      <rect x="0" y="0" width="155" height="28" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="14" y="18" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600">💼 Top 10 SaaS Suites</text>

      <!-- Pill 2: Open Source -->
      <rect x="167" y="0" width="165" height="28" rx="6" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="180" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="600">⭐ 24+ Curated OSS Repos</text>

      <!-- Pill 3: Interactive JS -->
      <rect x="344" y="0" width="180" height="28" rx="6" fill="#451a03" stroke="#b45309" stroke-width="1" />
      <text x="357" y="18" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="600">⚡ CPM, WBS &amp; React/Vue</text>
    </g>
  </g>
</svg>